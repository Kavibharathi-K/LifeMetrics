{{define "content"}}

<section class="page-section goals-page">

    <div class="page-header">

        <div>
            <p class="page-eyebrow">Personal profile</p>
            <h1 class="section-title">Goals</h1>
            <p class="page-subtitle">
                Set your metrics to calculate maintenance calories and macro targets.
            </p>
        </div>

    </div>

    <div id="goalsPageMessage"
         class="page-message"
         role="status">
    </div>

    <article class="page-card goals-form-card">

        <form id="goals-form">

            <div class="page-form-grid goals-form-grid">

                <div class="form-group">
                    <label for="goals-age">Age</label>
                    <input id="goals-age"
                           type="number"
                           name="age">
                </div>

                <div class="form-group">
                    <label for="goals-gender">Gender</label>
                    <select id="goals-gender" name="gender">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="goals-height">Height (cm)</label>
                    <input id="goals-height"
                           type="number"
                           name="height_cm">
                </div>

                <div class="form-group">
                    <label for="goals-weight">Weight (kg)</label>
                    <input id="goals-weight"
                           type="number"
                           name="weight_kg">
                </div>

                <div class="form-group form-full">
                    <label for="goals-activity">Activity Level</label>
                    <select id="goals-activity" name="activity_level">
                        <option value="sedentary">Sedentary</option>
                        <option value="lightly_active">Lightly active</option>
                        <option value="moderately_active">Moderately active</option>
                        <option value="very_active">Very active</option>
                        <option value="extra_active">Extra active</option>
                    </select>
                </div>

            </div>

            <div class="page-form-actions">
                <button type="submit">Save Goals</button>
            </div>

        </form>

        <div id="goals-result" class="goals-result"></div>

    </article>

</section>

{{end}}
