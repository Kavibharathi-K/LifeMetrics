{{define "register"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | LifeMetrics</title>

    <link rel="stylesheet" href="/static/css/styles.css?v=20260616-theme">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">

                <p class="auth-eyebrow">
                    LifeMetrics
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Start tracking your health and fitness.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        id="registerEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >

                </div>


                <p
                    id="registerError"
                    class="auth-error"
                ></p>


                <button
                    id="registerButton"
                    type="submit"
                >
                    Create account
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="/login">
                    Login
                </a>

            </div>

        </section>

    </main>


    <script src="/static/js/api.js"></script>
    <script src="/static/js/services/authService.js"></script>
    <script src="/static/js/pages/register.js"></script>

</body>

</html>
{{end}}
