{{define "content"}}

<section class="page-section">

    <div class="page-header">

        <div>
            <p class="page-eyebrow">Daily overview</p>
            <h1 class="section-title">Today's Nutrition</h1>
            <p class="page-subtitle">
                Track your calories and macros against your goals.
            </p>
        </div>

    </div>

    <div class="nutrition-dashboard">

        <article class="stat-card page-card">

            <div class="page-card-header">
                <span class="page-label">Calories</span>
            </div>

            <div id="calories-value" class="stat-value">0</div>

            <p class="stat-caption">Consumed today</p>

            <div class="progress-bar">
                <div id="calories-progress" class="progress-fill"></div>
            </div>

            <span id="calories-remaining" class="progress-remaining"></span>

        </article>

        <article class="stat-card page-card">

            <div class="page-card-header">
                <span class="page-label">Protein</span>
            </div>

            <p id="protein-value" class="stat-value stat-value-sm">0.0 g</p>

            <div class="progress-bar">
                <div id="protein-progress" class="progress-fill"></div>
            </div>

            <span id="protein-remaining" class="progress-remaining"></span>

        </article>

        <article class="stat-card page-card">

            <div class="page-card-header">
                <span class="page-label">Carbs</span>
            </div>

            <p id="carbs-value" class="stat-value stat-value-sm">0.0 g</p>

            <div class="progress-bar">
                <div id="carbs-progress" class="progress-fill"></div>
            </div>

            <span id="carbs-remaining" class="progress-remaining"></span>

        </article>

        <article class="stat-card page-card">

            <div class="page-card-header">
                <span class="page-label">Fat</span>
            </div>

            <p id="fat-value" class="stat-value stat-value-sm">0.0 g</p>

            <div class="progress-bar">
                <div id="fat-progress" class="progress-fill"></div>
            </div>

            <span id="fat-remaining" class="progress-remaining"></span>

        </article>

        <article class="stat-card page-card">

            <div class="page-card-header">
                <span class="page-label">Fiber</span>
            </div>

            <p id="fiber-value" class="stat-value stat-value-sm">0.0 g</p>

            <div class="progress-bar">
                <div id="fiber-progress" class="progress-fill"></div>
            </div>

            <span id="fiber-remaining" class="progress-remaining"></span>

        </article>

    </div>

</section>

{{end}}
