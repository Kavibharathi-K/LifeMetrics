{{define "content"}}

{{if eq .SubPage "foods"}}

<div id="foodsView" class="card">

<h1 class="section-title">Available Foods</h1>

<table id="foodTable">

<thead>
<tr>
<th>Name</th>
<th>Base Qty</th>
<th>Calories</th>
<th>Protein</th>
<th>Carbs</th>
<th>Fat</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

{{end}}



{{if eq .SubPage "meals"}}

<div id="mealsView">

<h1 class="section-title">Meals</h1>

<div class="meals-grid">

<div class="meal-card">
<h3>Breakfast</h3>
<button onclick="openMealModal('breakfast')">Add Food</button>
</div>

<div class="meal-card">
<h3>Lunch</h3>
<button onclick="openMealModal('lunch')">Add Food</button>
</div>

<div class="meal-card">
<h3>Dinner</h3>
<button onclick="openMealModal('dinner')">Add Food</button>
</div>

<div class="meal-card">
<h3>Snacks</h3>
<button onclick="openMealModal('snacks')">Add Food</button>
</div>

</div>

</div>

{{end}}



<!-- Modal -->
<div id="mealModal" class="modal">

<div class="modal-content">

<h3>Add Food</h3>

<label>Food Name</label>
<input type="text" id="foodNameInput">


<label>Quantity</label>
<input type="number" id="quantityInput">


<label>Measurement Type</label>
<select id="measurementTypeInput">

<option value="gram">Gram</option>

<option value="unit">Unit</option>

</select>


<p id="mealSuccessMsg" class="success-msg"></p>


<div class="modal-buttons">

<button onclick="closeMealModal()">Cancel</button>

<button onclick="submitMealItem()">Submit</button>

</div>

</div>

</div>

<script src="/static/js/food.js"></script>

{{end}}
