{{define "content"}}

{{if eq .SubPage "foods"}}

<section id="foodsView" class="card">

    <div class="section-header">

        <h1 class="section-title">
            Available Foods
        </h1>

    </div>

    <div class="table-container">

        <table id="foodTable">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Base Qty</th>
                    <th>Calories</th>
                    <th>Protein</th>
                    <th>Carbs</th>
                    <th>Fat</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

</section>

{{end}}


{{if eq .SubPage "meals"}}

<section id="mealsView">

    <div class="section-header">

        <h1 class="section-title">
            Meals
        </h1>

    </div>

    <div class="meals-grid">

        <div class="meal-card">
            <h3>Breakfast</h3>
            <div id="breakfastFoods" class="meal-foods"></div>
            <button onclick="openMealModal('breakfast')">
                Add Food
            </button>
        </div>

        <div class="meal-card">
            <h3>Lunch</h3>
            <div id="lunchFoods" class="meal-foods"></div>
            <button onclick="openMealModal('lunch')">
                Add Food
            </button>
        </div>

        <div class="meal-card">
            <h3>Dinner</h3>
            <div id="dinnerFoods" class="meal-foods"></div>
            <button onclick="openMealModal('dinner')">
                Add Food
            </button>
        </div>

        <div class="meal-card">
            <h3>Snacks</h3>
            <div id="snackFoods" class="meal-foods"></div>
            <button onclick="openMealModal('snacks')">
                Add Food
            </button>
        </div>

    </div>

</section>

{{end}}

<div id="mealModal" class="modal">

    <div class="modal-content">

        <h3>Add Food</h3>

        <label>Food Name</label>
        <input type="text" id="foodNameInput">

        <label>Quantity</label>
        <input type="number" id="quantityInput">

        <label>Measurement Type</label>

        <select id="measurementTypeInput">

            <option value="gram">
                Gram
            </option>

            <option value="unit">
                Unit
            </option>

        </select>

        <p id="mealSuccessMsg"
           class="success-msg">
        </p>

        <div class="modal-buttons">

            <button onclick="closeMealModal()">
                Cancel
            </button>

            <button onclick="submitMealItem()">
                Submit
            </button>

        </div>

    </div>

</div>

{{end}}
