{{define "content"}}

<h1 id="pageTitle">Available Foods</h1>

<!-- Available Foods View -->
<div id="foodsView">

<table id="foodTable">

<thead>
<tr>
<th>Name</th>
<th>Base Qty</th>
<th>Calories</th>
<th>Protein</th>
<th>Carbs</th>
<th>Fat</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

</div>


<!-- Meals View -->
<div id="mealsView" style="display:none">

<div class="meal-block">

<h2>Breakfast</h2>

<button onclick="openMealModal('breakfast')">
Add Food
</button>

</div>

<hr>


<div class="meal-block">

<h2>Lunch</h2>

<button onclick="openMealModal('lunch')">
Add Food
</button>

</div>

<hr>


<div class="meal-block">

<h2>Dinner</h2>

<button onclick="openMealModal('dinner')">
Add Food
</button>

</div>

<hr>


<div class="meal-block">

<h2>Snacks</h2>

<button onclick="openMealModal('snacks')">
Add Food
</button>

</div>

</div>


<!-- Modal -->
<div id="mealModal" class="modal">

<div class="modal-content">

<h3>Add Food</h3>

<label>Food Name</label>
<input type="text" id="foodNameInput">


<label>Quantity</label>
<input type="number" id="quantityInput">


<label>Measurement Type</label>
<select id="measurementTypeInput">

<option value="gram">Gram</option>

<option value="unit">Unit</option>

</select>


<p id="mealSuccessMsg" class="success-msg"></p>


<div class="modal-buttons">

<button onclick="closeMealModal()">Cancel</button>

<button onclick="submitMealItem()">Submit</button>

</div>

</div>

</div>

<script src="/static/js/food.js"></script>

{{end}}
