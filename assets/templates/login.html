{{define "login"}}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | LifeMetrics</title>

    <link rel="stylesheet"
      href="/static/css/styles.css?v=20260616-theme">

</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">

                <p class="auth-eyebrow">
                    LifeMetrics
                </p>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to continue tracking your health and fitness.
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>

                </div>

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required>

                </div>

                <p id="loginError"
                   class="auth-error">
                </p>

                <button
                    id="loginButton"
                    type="submit">
                    Login
                </button>

            </form>

            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="/register">
                    Create an account
                </a>

            </div>

        </section>

    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/services/authService.js"></script>
    <script src="/static/js/pages/login.js"></script>

</body>

</html>

{{end}}
